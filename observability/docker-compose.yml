services:
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  mysqld-exporter-master:
    image: prom/mysqld-exporter:v0.17.2
    container_name: mysqld-exporter-master
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=exporter123
    command:
      - '--mysqld.address=host.docker.internal:3307'
      - '--mysqld.username=exporter'

  mysqld-exporter-slave:
    image: prom/mysqld-exporter:v0.17.2
    container_name: mysqld-exporter-slave
    restart: unless-stopped
    ports:
      - "9105:9105"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=exporter123
    command:
      - '--mysqld.address=host.docker.internal:3308'
      - '--mysqld.username=exporter'
      - '--web.listen-address=:9105'

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'

volumes:
  prometheus_data:
  grafana_data:
